# ObjectDB - usar un archivo distinto para tests
objectdb.url=$objectdb$/test-redsocial.odb

# eXist-db - usar una colección distinta para tests
EXIST_POST_PATH=/db/test-redsocial/posts
EXIST_USER_PROFILE_PATH=/db/test-redsocial/perfilesUsuarios

springdotenv.filename=.env.test

# Logging más limpio en tests
logging.level.org.springframework=WARN
logging.level.com.redsocial=INFO